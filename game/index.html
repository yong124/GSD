<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경성뎐 : 여급 실종사건</title>
  <link rel="stylesheet" href="css/main.css?v=27">
  <link rel="stylesheet" href="css/dialogue.css?v=17">
  <link rel="stylesheet" href="css/effects.css?v=10">
</head>
<body>

<!-- ── 게임 컨테이너 ── -->
<div id="game-container">

  <!-- 배경 이미지 -->
  <div id="bg-layer"></div>
  <!-- 어두운 오버레이 (분위기) -->
  <div id="vignette"></div>
  <!-- 공포 이펙트 오버레이 -->
  <div id="effect-overlay"></div>
  <div id="investigation-hud" aria-hidden="true">
    <div class="hud-row">
      <span id="hud-scene-title"></span>
      <span id="hud-chapter"></span>
    </div>
    <div class="hud-row">
      <span id="hud-evidence-count"></span>
      <span id="hud-state-readout"></span>
    </div>
    <div id="hud-focus-row" class="hud-row hidden">
      <span id="hud-focus-kicker"></span>
      <span id="hud-focus-text"></span>
    </div>
  </div>
  <div id="hud-gauges" aria-hidden="true" aria-label="게이지 HUD"></div>
  <div id="standing-stage" aria-hidden="true">
    <div class="standing-slot" data-slot="Left">
      <div class="standing-figure">
        <img class="standing-img" alt="">
      </div>
    </div>
    <div class="standing-slot" data-slot="Center">
      <div class="standing-figure">
        <img class="standing-img" alt="">
      </div>
    </div>
    <div class="standing-slot" data-slot="Right">
      <div class="standing-figure">
        <img class="standing-img" alt="">
      </div>
    </div>
  </div>

  <!-- CG 삽화 (충격적인 장면에서 대사 라인 단위로 표시) -->
  <div id="cg-layer" aria-hidden="true">
    <img id="cg-image" src="" alt="">
  </div>

  <div id="title-screen">
    <div id="title-backdrop"></div>
    <div id="title-overlay"></div>
    <div id="title-grain"></div>
    <div id="title-body">
      <div id="title-left">
        <div id="title-left-line"></div>
        <div id="title-year-text">一九三二</div>
        <div id="title-deco-mark">◈</div>
        <div id="title-left-label">GYEONGSEONG</div>
      </div>
      <div id="title-content">
        <div id="title-kicker">1932 경성 미스터리</div>
        <h1 id="title-logo">경성뎐</h1>
        <div id="title-divider"></div>
        <div id="title-subtitle">여급 실종사건</div>
        <p id="title-copy">
          무죄로 묻힌 아동 실종 사건의 푸른 천은<br>
          낙원에서 사라진 여급 송금에게 이어진다.
        </p>
        <div id="title-actions">
          <button id="new-game-btn" class="title-btn"><span class="btn-marker">▶</span>새 게임</button>
          <button id="continue-btn" class="title-btn"><span class="btn-marker">▷</span>이어하기</button>
        </div>
        <div id="title-hint">SPACE 또는 ENTER로 시작</div>
      </div>
    </div>
  </div>

  <!-- 챕터 타이틀 카드 -->
  <div id="chapter-card" class="hidden">
    <div id="chapter-number"></div>
    <div id="chapter-title"></div>
  </div>

  <!-- 씬 배너 -->
  <div id="scene-banner" class="hidden">
    <div id="scene-banner-kicker"></div>
    <div id="scene-banner-title"></div>
  </div>

  <div id="scene-goal" class="hidden">
    <div id="scene-goal-kicker"></div>
    <div id="scene-goal-text"></div>
  </div>

  <!-- ── 대화창 ── -->
  <div id="dialogue-box">
    <div id="portrait-wrap">
      <img id="portrait-img" src="" alt="">
    </div>
    <div id="dialogue-content">
      <div id="speaker-name"></div>
      <div id="dialogue-text"></div>
      <div id="click-hint">▼</div>
    </div>
  </div>

  <!-- ── 선택지 ── -->
  <div id="choice-box" class="hidden">
    <div id="choice-list"></div>
  </div>
  <!-- ── 조사 수첩 버튼 ── -->
  <button id="memo-btn" title="조사 수첩">
    <span class="memo-btn-icon">📋</span>
    <span id="memo-badge" class="hidden" aria-hidden="true"></span>
  </button>

  <!-- ── 조사 수첩 패널 ── -->
  <div id="memo-panel" class="hidden">
    <div id="memo-header">
      <div>
        <div>조사 수첩</div>
        <div id="memo-meta"></div>
      </div>
      <button id="memo-close">✕</button>
    </div>
    <div id="memo-tabs">
      <button class="memo-tab is-active" data-tab="status">상태</button>
      <button class="memo-tab" data-tab="characters">인물</button>
      <button class="memo-tab" data-tab="evidence">단서</button>
      <button class="memo-tab" data-tab="questions">질문</button>
      <button class="memo-tab" data-tab="log">기록</button>
    </div>
    <div id="memo-list"></div>
  </div>

  <!-- ── 단서 획득 알림 ── -->
  <div id="evidence-toast" class="hidden"></div>

  <!-- ── 상단 메뉴 ── -->
  <div id="top-menu">
    <button id="skip-btn" title="스킵 (X)">스킵</button>
    <button id="auto-btn" title="자동 (A)">자동</button>
    <button id="save-btn">저장</button>
    <button id="load-btn">불러오기</button>
    <button id="settings-btn" title="설정 (O)">설정</button>
  </div>

  <!-- ── 설정 패널 ── -->
  <div id="settings-panel" class="hidden">
    <div id="settings-panel-title">설정</div>
    <div class="settings-row">
      <label class="settings-label" for="settings-bgm-volume">배경음 볼륨</label>
      <input type="range" id="settings-bgm-volume" min="0" max="100" step="1">
      <span class="settings-value" id="settings-bgm-value"></span>
    </div>
    <div class="settings-row">
      <label class="settings-label" for="settings-sfx-volume">효과음 볼륨</label>
      <input type="range" id="settings-sfx-volume" min="0" max="100" step="1">
      <span class="settings-value" id="settings-sfx-value"></span>
    </div>
    <div class="settings-row">
      <label class="settings-label" for="settings-mute">소리 끄기</label>
      <input type="checkbox" id="settings-mute">
    </div>
    <div class="settings-row settings-row-speed">
      <span class="settings-label">글자 속도</span>
      <div id="settings-text-speed" class="settings-speed-group">
        <button type="button" class="settings-speed-btn" data-speed="slow">느리게</button>
        <button type="button" class="settings-speed-btn" data-speed="normal">보통</button>
        <button type="button" class="settings-speed-btn" data-speed="fast">빠르게</button>
      </div>
    </div>
    <button id="settings-close">닫기</button>
  </div>
  <div id="settings-overlay" class="hidden"></div>

  <!-- ── 슬롯 선택 패널 ── -->
  <div id="slot-panel" class="hidden">
    <div id="slot-panel-title"></div>
    <div id="slot-panel-subtitle"></div>
    <div id="slot-list"></div>
    <button id="slot-cancel">취소</button>
  </div>
  <div id="slot-overlay" class="hidden"></div>

  <!-- ── 저장/불러오기 알림 ── -->
  <div id="system-toast" class="hidden"></div>

</div>

<!-- 구성 요소 -->
<script src="js/config.js?v=11"></script>

<!-- 데이터 (export_to_json.py 로 생성) -->
<script src="data/game_data.js?v=16"></script>
<script src="data/chapters/ch0.js?v=1"></script>
<script src="data/chapters/ch1.js?v=1"></script>
<script src="data/chapters/ch2.js?v=1"></script>
<script src="data/chapters/ch3.js?v=1"></script>
<script src="data/chapters/ch4.js?v=1"></script>
<script src="data/chapters/ch5.js?v=1"></script>
<script src="data/chapters/ch6.js?v=1"></script>
<script src="js/core/data.js?v=1"></script>

<!-- 엔진 코어 -->
<script src="js/core/engine.js?v=13"></script>
<script src="js/managers/effects.js?v=11"></script>
<script src="js/managers/audio.js?v=12"></script>
<script src="js/managers/ui.js?v=25"></script>
<script src="js/managers/input.js?v=12"></script>

<!-- 엔진 모듈 -->
<script src="js/engine/state.js?v=15"></script>
<script src="js/engine/save.js?v=12"></script>
<script src="js/engine/settings.js?v=1"></script>
  <script src="js/engine/evidence.js?v=25"></script>
<script src="js/engine/dialogue.js?v=17"></script>
<script src="js/engine/choice.js?v=19"></script>
<script src="js/engine/scene.js?v=23"></script>
<script src="js/main.js?v=11"></script>

</body>
</html>
